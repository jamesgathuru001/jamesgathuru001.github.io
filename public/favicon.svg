<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JG">
  <!--
    The JG monogram, drawn as outlines rather than <text>.

    A favicon is rasterised outside the page, so the site's webfont is not
    available to it — a `font-family` would silently fall back to whatever the
    OS has, and in the contexts that render no text at all it would leave a
    blank gradient tile. Paths always draw. That, not style, is why the letters
    are geometry.

    Gradient is the accent pair from styles/tokens.css (the 233 degree hue).
  -->
  <defs>
    <linearGradient id="jg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c9cff" />
      <stop offset="1" stop-color="#4361ff" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#jg)" />

  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- J: stem, then the hook sweeping left beneath it. -->
    <path d="M25 19 V33 a8.5 8.5 0 0 1 -17 0" />
    <!-- G: a ring left open to the right, closed by the crossbar. -->
    <path d="M53.4 24.6 A11.5 11.5 0 1 0 54.6 36.4 H46" />
  </g>
</svg>
