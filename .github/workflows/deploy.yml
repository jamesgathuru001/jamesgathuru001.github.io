name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy without an empty commit.
  workflow_dispatch:

# Read the repo, mint the Pages token. Nothing wider.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being
# cancelled, so a half-uploaded artifact can't become the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 runs natively on Node 24; v4 targets Node 20 and the runner now
      # force-upgrades it with a deprecation warning.
      - uses: actions/checkout@v5

      # No `cache: npm`. A partially-restored ~/.npm cache is a well-known way
      # to make `npm ci` fail with integrity errors, and it only saves ~20s on
      # an install this size. Correctness over the cache.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Environment
        run: |
          echo "node    $(node -v)"
          echo "npm     $(npm -v)"
          echo "runner  $(uname -srm)"
          echo "lockfileVersion $(node -p "require('./package-lock.json').lockfileVersion")"

      # npm's real error lives in the step log, which is not readable without a
      # token — so on failure we re-emit it as ::error:: annotations, which show
      # up in the run summary. `npm ci` always names its cause (EINTEGRITY,
      # ETARGET, EBADPLATFORM, EUSAGE...), and that one line is the whole
      # diagnosis.
      - name: Install dependencies
        run: |
          set -o pipefail
          if ! npm ci --no-audit --no-fund --foreground-scripts 2>&1 | tee /tmp/npm-ci.log; then
            echo "::group::npm ci output (tail)"
            tail -n 80 /tmp/npm-ci.log
            echo "::endgroup::"
            # HEAD, not tail: npm states the cause first ("npm error code
            # EUSAGE", then the reason) and dumps its full options list after.
            # The previous run annotated the options dump and told us nothing.
            head -n 30 /tmp/npm-ci.log \
              | while IFS= read -r line; do echo "::error::${line}"; done
            for f in "$HOME"/.npm/_logs/*-debug-0.log; do
              [ -f "$f" ] || continue
              echo "::group::npm debug log"
              tail -n 60 "$f"
              echo "::endgroup::"
            done
            exit 1
          fi

      - name: Lint
        run: npm run lint

      # Not a secret, and deliberately not stored as one. Anything VITE_-prefixed
      # is inlined into the client bundle at build time, so this value is public
      # the moment the site ships — putting it in `secrets` would only disguise
      # that and add a setup step that, if forgotten, silently downgrades the
      # contact form to a mailto link. Web3Forms keys are meant to be public;
      # what protects the inbox is the domain lock in their dashboard.
      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_KEY: 9185cb01-cef3-4eb0-b70d-818c6bda640b

      # The suite drives the real production build — routing, the focus trap,
      # the layered Escape, the accent contrast. A red build should not deploy.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      # Fail loudly here rather than shipping a site whose deep links 404 or
      # whose custom domain silently drops.
      - name: Verify deploy artifacts
        run: |
          test -f dist/404.html || { echo "::error::dist/404.html missing — /work would 404 on refresh"; exit 1; }
          test -f dist/CNAME   || { echo "::error::dist/CNAME missing — custom domain would be dropped"; exit 1; }
          echo "CNAME: $(cat dist/CNAME)"
          # A missing key does not break the build — the form degrades to a
          # mailto link. That is the right behaviour in a browser and the wrong
          # thing to discover in production, so assert the relay actually made
          # it into the bundle.
          grep -rq "api.web3forms.com" dist/assets/*.js \
            || { echo "::error::contact form relay missing from the bundle — VITE_WEB3FORMS_KEY did not reach the build"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
