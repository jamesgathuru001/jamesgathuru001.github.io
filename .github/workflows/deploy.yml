name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy without an empty commit.
  workflow_dispatch:

# Read the repo, mint the Pages token. Nothing wider.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being
# cancelled, so a half-uploaded artifact can't become the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm`. A partially-restored ~/.npm cache is a well-known way
      # to make `npm ci` fail with integrity errors, and it only saves ~20s on
      # an install this size. Correctness over the cache.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Environment
        run: |
          echo "node    $(node -v)"
          echo "npm     $(npm -v)"
          echo "runner  $(uname -srm)"
          echo "lockfileVersion $(node -p "require('./package-lock.json').lockfileVersion")"

      # --foreground-scripts surfaces native install output (sharp, rolldown,
      # lightningcss) instead of swallowing it, so a failure here is readable.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --foreground-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The suite drives the real production build — routing, the focus trap,
      # the layered Escape, the accent contrast. A red build should not deploy.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      # Fail loudly here rather than shipping a site whose deep links 404 or
      # whose custom domain silently drops.
      - name: Verify deploy artifacts
        run: |
          test -f dist/404.html || { echo "::error::dist/404.html missing — /work would 404 on refresh"; exit 1; }
          test -f dist/CNAME   || { echo "::error::dist/CNAME missing — custom domain would be dropped"; exit 1; }
          echo "CNAME: $(cat dist/CNAME)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
